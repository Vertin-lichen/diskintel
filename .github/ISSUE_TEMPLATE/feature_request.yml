name: 功能建议
description: 新功能或体验改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想要解决什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么解决
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 参考